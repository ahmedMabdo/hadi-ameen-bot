name: selftests

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # نفس توقيت السيرفر — من غيره فحوصات التواريخ بتقيس نظام تاني
      TZ: Africa/Cairo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: تثبيت الاعتماديات
        run: pip install -r requirements.txt

      - name: كل الملفات بتتكمبل
        run: python3 -m compileall -q .

      - name: selftests
        run: |
          set -e
          for m in env_loader memory_guard memory_store knowledge_store \
                   cr_media ado_features heartbeat eval_store posthog_cli \
                   followup_store; do
            echo "──────── $m"
            python3 "$m.py" selftest
          done

      - name: اختبار حراس الـ Bash (آخر خط دفاع برمجي)
        run: python3 tests/test_guards.py

      - name: سكيما الحالات الذهبية (من غير نداء موديل)
        run: python3 eval_runner.py validate

      - name: كل أداة متعلَّمة في CLAUDE.md ليها صلاحية مقابلة
        run: |
          # jq مش grep: الـ grep كان بيمشي على الملف كله فبيلقط قسم deny كأنه
          # allow — يعني أداة **ممنوعة** ومتعلَّمة في CLAUDE.md كانت بتعدّي الفحص.
          MISSING=$(comm -23 \
            <(grep -oE "python3 [a-z_0-9]+\.py" CLAUDE.md | awk '{print $2}' | sort -u) \
            <(jq -r '.permissions.allow[]' setup/settings.local.json | grep -oE "python3 [a-z_0-9]+\.py" | awk '{print $2}' | sort -u))
          if [ -n "$MISSING" ]; then
            echo "❌ تعليمات من غير صلاحية (وعد كاذب):"; echo "$MISSING"; exit 1
          fi
          echo "✅ كل أداة متعلَّمة مسموحة"

      - name: التوثيق متطابق مع الكود
        run: |
          BIZ=$(grep -oE "BIZ_END_HOUR = [0-9]+" intel/8orders_report_generator.py | grep -oE "[0-9]+$")
          grep -q "0${BIZ}:00" CLAUDE.md || {
            echo "❌ نافذة يوم العمل في CLAUDE.md مش متطابقة مع BIZ_END_HOUR=${BIZ}"; exit 1; }
          echo "✅ نافذة يوم العمل متطابقة"

      - name: مفيش أسرار في الريبو
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
