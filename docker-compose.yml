# متوافق مع Dokploy — نوع الـ Compose: "Docker Compose"
# البوت مالوش port وارد (بيتصل بـ Discord/ADO/PostHog خارجًا) → مش محتاج domain ولا Traefik.

services:
  hadi-ameen-bot:
    # build من المصدر بدل سحب صورة GHCR الخاصة —
    # Dokploy بيعمل git clone للريبو أصلاً، فبيبني الصورة محليًا من Dockerfile.
    # كده مفيش حاجة تتسحب من GHCR ومفيش صلاحيات registry مطلوبة.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # الـ 58 متغير بتتحط في تبويب "Environment" بتاع السيرفس في Dokploy،
    # وDokploy بيكتبهم في ملف .env جنب الـ compose، فبيتقروا من هنا داخل الكونتينر.
    env_file:
      - .env

    # named volumes (مش bind mounts بـ ./) — لأن Dokploy بيعمل git clone نضيف كل deploy
    # وبيمسح مجلد الريبو، فأي mount بـ ./knowledge بيتفضّى. الـ named volume بيتسيّد
    # من الصورة أول مرة (الصورة فيها knowledge/ أصلاً) وبيفضل ثابت بعد كل نشر.
    volumes:
      - hadi-knowledge:/app/knowledge   # ذاكرة هادي اللي بيتعلّمها وقت التشغيل
      - hadi-logs:/app/logs             # اللوجات

volumes:
  hadi-knowledge:
  hadi-logs:
