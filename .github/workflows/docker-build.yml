name: Build and Push Docker image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
env:
  GHCR_OWNER: assergameel-soul   # must be lowercase
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/hadi-ameen-bot:latest
            ghcr.io/${{ env.GHCR_OWNER }}/hadi-ameen-bot:${{ github.sha }}
