# متوافق مع Dokploy — نوع الـ Compose: "Docker Compose"
# البوت مالوش port وارد (بيتصل بـ Discord/ADO/PostHog خارجًا) → مش محتاج domain ولا Traefik.

services:
  hadi-ameen-bot:
    # build من المصدر بدل سحب صورة GHCR الخاصة (Dokploy بيعمل git clone ويبني محليًا)
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # كل الـ58 متغير من تبويب Environment (Dokploy بيكتبهم في .env)
    env_file:
      - .env

    # توجيه كل ملفات حالة التشغيل لمجلد ثابت /app/data (volume) عشان تفضل بعد أي redeploy.
    # القيم دي مش أسرار، ومتوافقة للخلف: من غيرها الكود بيرجع لمساراته القديمة.
    environment:
      # ‼ لازم يفضل موجود: جدولة Dokploy بتنفّذ الكرون بتوقيت الكونتينر. من غيره الكرون
      # بيبقى UTC، والتقرير الأسبوعي بيتزحلق ساعة كل ما التوقيت الصيفي في مصر يتغيّر.
      TZ: Africa/Cairo
      # كان ناقص: sessions.json كان بيتكتب في /app (مش volume)، فكل redeploy
      # بيمسح كل المحادثات المفتوحة. الكومنت تحت كان بيوعد بده والكود مابيعملهوش.
      HADI_SESSIONS_FILE: /app/data/sessions.json
      HADI_REMINDERS_FILE: /app/data/reminders.json
      HADI_TRIAGE_STATE: /app/data/triage_state.json
      HADI_PENDING_STORE: /app/data/pending_points.json
      ADO_INTAKE_STATE: /app/data/sprint_intake_state.json
      ADO_CEREMONIES_JSON: /app/data/sprint_ceremonies.json
      ADO_SNAPSHOT_DB: /app/data/ado_snapshot.db

    volumes:
      - hadi-knowledge:/app/knowledge   # ذاكرة هادي (متسيّدة من الصورة + git auto-push)
      - hadi-logs:/app/logs             # اللوجات + heartbeat/birthday state
      - hadi-data:/app/data             # حالة التشغيل: reminders/sessions/sprint/triage/snapshot

volumes:
  hadi-knowledge:
  hadi-logs:
  hadi-data:
